name: Deploy to VPS (IIS)

# Runs on a self-hosted GitHub Actions runner installed on the Windows VPS itself.
# See deploy/README.md for one-time VPS setup instructions (IIS, Hosting Bundle, SQL Server,
# runner installation).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish API (also builds the Angular client into wwwroot)
        shell: powershell
        run: |
          dotnet publish src/IFWEMS.Api/IFWEMS.Api.csproj -c Release -o "$env:RUNNER_TEMP/publish"

      - name: Apply EF Core migrations
        shell: powershell
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          # Fail fast with a clear message instead of the cryptic "Missing required option
          # '--assembly'" that dotnet-ef produces further down when this is empty -- e.g. if
          # PROD_CONNECTION_STRING isn't set on the repo or the 'production' environment yet.
          if ([string]::IsNullOrWhiteSpace($env:ConnectionStrings__DefaultConnection)) {
            throw "ConnectionStrings__DefaultConnection is empty. Set the PROD_CONNECTION_STRING secret: repo Settings > Secrets and variables > Actions (or the 'production' environment's own secrets)."
          }

          # Diagnostics kept in the log so a future failure here doesn't need reproducing blind --
          # see deploy/README.md's note that a stray newer major SDK on the VPS causes dotnet-ef
          # to fail with "Missing required option '--assembly'" too.
          dotnet --list-sdks

          # dotnet-ef comes from the repo-local tool manifest (.config/dotnet-tools.json), not a
          # global install, so it works regardless of which account runs the runner service.
          dotnet tool restore

          # --configuration Release matches the Release build the previous step just produced.
          # Leaving this unset makes dotnet-ef default to Debug and re-evaluate the project from
          # scratch against a checkout whose obj/ cache was last written for Release -- that
          # mismatch is what has been producing "Missing required option '--assembly'" here.
          dotnet ef database update `
            --project src/IFWEMS.Infrastructure `
            --startup-project src/IFWEMS.Api `
            --configuration Release `
            --connection "$env:ConnectionStrings__DefaultConnection" `
            --verbose

      - name: Stop IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "${{ vars.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
          Stop-WebAppPool -Name "${{ vars.IIS_APP_POOL_NAME }}" -ErrorAction SilentlyContinue

      - name: Deploy published output
        shell: powershell
        run: |
          $dest = "${{ vars.IIS_SITE_PATH }}"
          robocopy "$env:RUNNER_TEMP/publish" $dest /MIR /XD "$dest\logs" /NFL /NDL /NJH
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }

      - name: Start IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "${{ vars.IIS_APP_POOL_NAME }}"
          Start-WebSite -Name "${{ vars.IIS_SITE_NAME }}"

      - name: Smoke test
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $resp = Invoke-WebRequest -Uri "${{ vars.SITE_HEALTH_URL }}" -UseBasicParsing
          if ($resp.StatusCode -ne 200) { throw "Health check failed: $($resp.StatusCode)" }
