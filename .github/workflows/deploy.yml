name: Deploy to VPS (IIS)

# Runs on a self-hosted GitHub Actions runner installed on the Windows VPS itself.
# See deploy/README.md for one-time VPS setup instructions (IIS, Hosting Bundle, SQL Server,
# runner installation).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish API (also builds the Angular client into wwwroot)
        shell: powershell
        run: |
          dotnet publish src/IFWEMS.Api/IFWEMS.Api.csproj -c Release -o "$env:RUNNER_TEMP/publish"

      - name: Apply EF Core migrations
        shell: powershell
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.PROD_CONNECTION_STRING }}
        run: |
          # dotnet-ef must be installed as a global tool on the VPS runner (dotnet tool install --global dotnet-ef).
          dotnet ef database update `
            --project src/IFWEMS.Infrastructure `
            --startup-project src/IFWEMS.Api `
            --connection "$env:ConnectionStrings__DefaultConnection"

      - name: Stop IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-WebSite -Name "${{ vars.IIS_SITE_NAME }}" -ErrorAction SilentlyContinue
          Stop-WebAppPool -Name "${{ vars.IIS_APP_POOL_NAME }}" -ErrorAction SilentlyContinue

      - name: Deploy published output
        shell: powershell
        run: |
          $dest = "${{ vars.IIS_SITE_PATH }}"
          robocopy "$env:RUNNER_TEMP/publish" $dest /MIR /XD "$dest\logs" /NFL /NDL /NJH
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed with exit code $LASTEXITCODE" }

      - name: Start IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "${{ vars.IIS_APP_POOL_NAME }}"
          Start-WebSite -Name "${{ vars.IIS_SITE_NAME }}"

      - name: Smoke test
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $resp = Invoke-WebRequest -Uri "${{ vars.SITE_HEALTH_URL }}" -UseBasicParsing
          if ($resp.StatusCode -ne 200) { throw "Health check failed: $($resp.StatusCode)" }
