<div class="compliance-check">
  <h1>Real-Time Compliance Check</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="transactionReference">Transaction Reference</label>
    <input id="transactionReference" formControlName="transactionReference" />

    <label for="orgUnitId">Org Unit</label>
    <select id="orgUnitId" formControlName="orgUnitId">
      <option value="" disabled>Select an org unit&hellip;</option>
      @for (orgUnit of orgUnits(); track orgUnit.id) {
        <option [value]="orgUnit.id">{{ orgUnit.name }} ({{ orgUnit.code }})</option>
      }
    </select>

    <label for="supplierId">Supplier (optional)</label>
    <select id="supplierId" formControlName="supplierId">
      <option value="">None</option>
      @for (supplier of suppliers(); track supplier.id) {
        <option [value]="supplier.id">{{ supplier.name }} ({{ supplier.supplierCode }})</option>
      }
    </select>

    <label for="contractId">Contract (optional)</label>
    <select id="contractId" formControlName="contractId">
      <option value="">None</option>
      @for (contract of contracts(); track contract.id) {
        <option [value]="contract.id">{{ contract.title }} ({{ contract.contractNumber }})</option>
      }
    </select>

    <label for="amount">Amount</label>
    <input id="amount" type="number" formControlName="amount" />

    <label for="invoiceReference">Invoice Reference (optional)</label>
    <input id="invoiceReference" formControlName="invoiceReference" />

    <label for="purchaseOrderDateUtc">Purchase Order Date (optional)</label>
    <input id="purchaseOrderDateUtc" type="date" formControlName="purchaseOrderDateUtc" />

    <label for="commodityCode">Commodity Code (optional)</label>
    <input id="commodityCode" formControlName="commodityCode" />

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || isChecking()">
      {{ isChecking() ? 'Checking...' : 'Run Check' }}
    </button>
  </form>

  @if (result(); as r) {
    <div class="result" [class]="r.riskRating.toLowerCase()">
      <p><strong>Risk Score:</strong> {{ r.riskScore }}</p>
      <p><strong>Risk Rating:</strong> {{ r.riskRating }}</p>
      <p><strong>Recommended Action:</strong> {{ r.recommendedAction }}</p>
      @if (r.failedRuleCodes.length) {
        <p><strong>Failed Rules:</strong> {{ r.failedRuleCodes.join(', ') }}</p>
      }
    </div>
  }
</div>
