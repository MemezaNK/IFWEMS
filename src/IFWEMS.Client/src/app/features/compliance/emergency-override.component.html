<div class="emergency-override">
  <h1>Emergency Procurement Override</h1>
  <p class="hint">
    Capturing an override automatically raises a post-transaction compliance review case (FR-013).
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="transactionReference">Transaction Reference</label>
    <input id="transactionReference" formControlName="transactionReference" />

    <label for="orgUnitId">Org Unit</label>
    <select id="orgUnitId" formControlName="orgUnitId">
      <option value="" disabled>Select an org unit&hellip;</option>
      @for (orgUnit of orgUnits(); track orgUnit.id) {
        <option [value]="orgUnit.id">{{ orgUnit.name }} ({{ orgUnit.code }})</option>
      }
    </select>

    <label for="supplierId">Supplier (optional)</label>
    <select id="supplierId" formControlName="supplierId">
      <option value="">None</option>
      @for (supplier of suppliers(); track supplier.id) {
        <option [value]="supplier.id">{{ supplier.name }} ({{ supplier.supplierCode }})</option>
      }
    </select>

    <label for="amount">Amount</label>
    <input id="amount" type="number" formControlName="amount" />

    <label for="emergencyCategory">Emergency Category</label>
    <input id="emergencyCategory" formControlName="emergencyCategory" placeholder="e.g. PatientCareEmergency" />

    <label for="reason">Reason</label>
    <textarea id="reason" formControlName="reason" rows="3"></textarea>

    <label for="evidenceDocumentId">Evidence Document</label>
    <select id="evidenceDocumentId" formControlName="evidenceDocumentId">
      <option value="" disabled>Select a document&hellip;</option>
      @for (document of documents(); track document.id) {
        <option [value]="document.id">{{ document.fileName }} (v{{ document.version }})</option>
      }
    </select>

    <label for="commodityCode">Commodity Code (optional)</label>
    <input id="commodityCode" formControlName="commodityCode" />

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    @if (transactionId()) {
      <p class="success">Override captured. Transaction Id: {{ transactionId() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Submitting...' : 'Capture Override' }}
    </button>
  </form>
</div>
