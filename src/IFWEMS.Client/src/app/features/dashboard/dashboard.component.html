<div class="dashboard">
  <h1>IFWEMS Dashboard</h1>
  <p>Welcome, {{ authService.currentUser()?.username }}.</p>

  <div class="card-grid">
    @for (card of visibleCards(); track card.link) {
      <mat-card>
        <mat-card-header>
          <mat-icon mat-card-avatar aria-hidden="true">{{ card.icon }}</mat-icon>
          <mat-card-title>{{ card.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ card.description }}</p>
        </mat-card-content>
        <mat-card-actions>
          <a mat-button color="primary" [routerLink]="card.link">Open</a>
        </mat-card-actions>
      </mat-card>
    }
  </div>
</div>
