<div class="page-container reports">
  <div class="page-header">
    <div class="page-heading">
      <h1>Reports &amp; Registers</h1>
      <p class="page-subtitle">Export operational registers to CSV (Excel-compatible).</p>
    </div>
  </div>

  @if (errorMessage()) {
    <p class="error-text">{{ errorMessage() }}</p>
  }

  <div class="register-grid">
    @for (register of registers; track register.key) {
      <mat-card class="section-card register-card">
        <mat-card-content>
          <mat-icon class="register-icon">{{ register.icon }}</mat-icon>
          <h2>{{ register.title }}</h2>
          <p>{{ register.description }}</p>
          <button mat-stroked-button color="primary" [disabled]="downloadingKey() === register.key" (click)="download(register.key)">
            @if (downloadingKey() === register.key) {
              <span>Preparing&hellip;</span>
            } @else {
              <mat-icon>download</mat-icon> Download CSV
            }
          </button>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
